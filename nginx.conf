server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 256;

  # CORS proxy for Huxley2 — adds CORS headers on ALL responses so the
  # browser can read 5xx error bodies too (Huxley2 returns 500 without
  # CORS headers, which browsers abort).
  location /api/huxley/ {
    proxy_pass https://huxley2.azurewebsites.net/;
    proxy_set_header Host huxley2.azurewebsites.net;
    proxy_set_header Origin "";
    proxy_ssl_name huxley2.azurewebsites.net;
    proxy_buffering off;
    proxy_connect_timeout 8s;
    proxy_read_timeout 12s;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Max-Age 600 always;
    add_header Content-Type "application/json" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }
}