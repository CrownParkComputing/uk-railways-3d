server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # gzip
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 256;

  # CORS proxy for Huxley2 (upstream returns 500 with no CORS headers
  # so the browser aborts. We re-fetch server-side and always re-add the
  # CORS header so error responses also reach the browser).
  location /api/huxley/ {
    proxy_pass https://huxley2.azurewebsites.net/;
    proxy_set_header Host huxley2.azurewebsites.net;
    proxy_set_header Origin "";
    proxy_ssl_server_name huxley2.azurewebsites.net;
    proxy_buffering off;
    proxy_connect_timeout 8s;
    proxy_read_timeout 12s;
    # Always add CORS headers — including on 5xx error responses
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Max-Age 600 always;
    if ($request_method = OPTIONS) {
      return 204;
    }
  }

  # SPA fallback — serve index.html for any unknown route
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache static assets aggressively
  location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }
}